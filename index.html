<style>
/* Layout: big title + search + category chips + "Nur mit" toggles; card grid with an illustrated colour block per category;
   "Woche" drawer (Plan / Einkauf) slides in from the right. */
:root{
  --bg:#F6F1E9; --surface:#FFFDF9; --ink:#2B2118; --muted:#6B5E50; --line:#DDD3C4; --soft:#ECE4D6;
  --accent:#2B2118; --accent-ink:#FFFDF9; --hi:#3F5A3A; --hi-soft:#E3E9D6;
  --c-we:#5B7345; --c-wt:#C4623F; --c-buero:#D9A23A; --c-fs:#7A3E57; --c-vor:#4C7A78; --c-bak:#9A6B45;
  --dish:#F7F4F1; --dish2:#DCD6D1;
  --shadow:0 1px 2px rgba(43,33,24,.07),0 8px 22px rgba(43,33,24,.07);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F; --surface:#221C16; --ink:#F1E9DD; --muted:#B2A593; --line:#3A3026; --soft:#2C241C;
    --accent:#F1E9DD; --accent-ink:#17130F; --hi:#A9C48A; --hi-soft:#2B3322;
    --c-we:#4E6439; --c-wt:#B0553A; --c-buero:#B98A2C; --c-fs:#6A3349; --c-vor:#42696A; --c-bak:#8A5A3C;
    --shadow:0 0 0 1px rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#221C16; --ink:#F1E9DD; --muted:#B2A593; --line:#3A3026; --soft:#2C241C;
  --accent:#F1E9DD; --accent-ink:#17130F; --hi:#A9C48A; --hi-soft:#2B3322;
  --c-we:#4E6439; --c-wt:#B0553A; --c-buero:#B98A2C; --c-fs:#6A3349; --c-vor:#42696A; --c-bak:#8A5A3C;
  --shadow:0 0 0 1px rgba(255,255,255,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(28px + env(safe-area-inset-top, 0px)) 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--hi) 65%,transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px}

/* head */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap}
.head h1{font-size:clamp(38px,6vw,64px);font-weight:800;line-height:1;letter-spacing:-.035em}
.head p{color:var(--muted);max-width:560px;margin:14px 0 0;font-size:17px}
.weekbtn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:23px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.weekbtn .n{min-width:24px;height:24px;border-radius:12px;background:var(--accent-ink);color:var(--accent);display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.count{color:var(--muted);align-self:flex-end;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.search{margin:26px 0 16px;max-width:640px}
.search input{width:100%;height:54px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--hi);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips + .chips{margin-top:12px}
.chip{height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.sub .chip{height:40px;padding:0 18px;font-weight:500}
.chips .lbl{color:var(--muted);margin-right:4px}
@media (max-width:700px){
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:22px;margin-top:26px}
.card{position:relative;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.card.on{box-shadow:0 0 0 3px var(--hi),var(--shadow)}
.hero{position:relative;display:block;width:100%;aspect-ratio:4/2.9;border:0;padding:0;background:var(--cc);overflow:hidden;cursor:pointer;color:#fff}
.hero svg{position:absolute;inset:6% 6% 4%;width:88%;height:90%}
.hero .cat{position:absolute;left:14px;bottom:12px;padding:5px 9px;border-radius:7px;background:rgba(0,0,0,.35);color:#fff;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.plus{position:absolute;right:14px;top:14px;width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#13231C;font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}
.card.on .plus{background:var(--hi);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card.on .plus{color:#17130F}}
:root[data-theme="dark"] .card.on .plus{color:#17130F}
.plus svg{position:static;width:22px;height:22px;inset:auto}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:21px;line-height:1.2;font-weight:650}
.body h3 button{all:unset;cursor:pointer}
.body h3 button:focus-visible{outline:3px solid color-mix(in srgb,var(--hi) 65%,transparent);outline-offset:3px;border-radius:4px}
.meta{color:var(--muted);font-family:var(--f-mono);font-size:13px;letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.g{background:var(--hi-soft);color:var(--hi)}
.empty{grid-column:1/-1;padding:48px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;margin-bottom:6px}

/* dialogs */
dialog{border:0;padding:0;color:var(--ink);background:var(--bg)}
dialog::backdrop{background:rgba(10,20,15,.55)}
dialog.sheet{width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4)}
dialog.sheet[open]{display:flex;flex-direction:column}
@media (max-width:680px){dialog.sheet{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;height:94vh;height:94dvh;max-height:94vh;max-height:94dvh}}
.dhero{position:relative;flex:none;height:210px;background:var(--cc)}
.dhero svg{position:absolute;inset:6% 0 4%;width:100%;height:90%}
.xbtn{position:absolute;right:14px;top:14px;height:42px;padding:0 16px;border-radius:21px;border:0;background:#fff;color:#13231C;font-weight:700;z-index:2}
.dscroll{overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.dhead{padding:20px 22px 6px}
.dhead h2{font-size:clamp(26px,4vw,36px);line-height:1.1;font-weight:750;margin:8px 0 12px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.dmeta b{color:var(--ink);font-weight:500}
.dbody{padding:10px 22px 22px;display:grid;gap:22px}
.cols{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:28px;align-items:start}
@media (max-width:680px){.cols{grid-template-columns:minmax(0,1fr)}}
.dbody h3{font-size:13px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;margin-bottom:10px}
.zl{list-style:none;margin:0;padding:0}
.zl li{padding:8px 0;border-bottom:1px solid var(--line)}
.zl li.lab{border:0;padding:14px 0 2px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--hi)}
.steps{margin:0;padding-left:22px;display:grid;gap:12px}
.steps li::marker{font-weight:700;color:var(--hi)}
.nut{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--hi-soft);font-size:14.5px}
.nut .nv{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.nut .nv b{color:var(--ink);font-weight:500}
.nut p{margin:6px 0 0}.nut small{display:block;margin-top:6px;color:var(--muted);font-size:11.5px}
.note{padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:15px}
.note b{display:block;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px;font-weight:500}
.dfoot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:23px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{height:40px;padding:0 16px;font-size:15px}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--accent-ink)}
.btn.hi{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.hi{color:#17130F}}
:root[data-theme="dark"] .btn.hi{color:#17130F}
@media (max-width:680px){.dfoot .btn.ghost{display:none}.dfoot .btn{flex:1}}

/* drawer */
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;height:100dvh;max-height:100dvh;width:min(440px,100vw);max-width:100vw;border-radius:0;overflow:hidden;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
dialog.drawer[open]{display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog.drawer[open]{animation:none}}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 8px}
.dr-head h2{font-size:30px;font-weight:800}
.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--hi)}
.dr-body{flex:1;overflow:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.dayh{margin:22px 0 8px;color:var(--muted)}
.pitem{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.pthumb{width:64px;height:64px;border-radius:12px;background:var(--cc);position:relative;overflow:hidden}
.pthumb svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
.pitem .t{font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.pitem .row{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pitem select{height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);padding:0 8px;font-size:14px}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.aisle{margin-top:22px}
.aisle h3{display:flex;justify-content:space-between}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.items li{border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;cursor:pointer;align-items:start}
.items input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--line);border-radius:7px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.items input:checked{background:var(--hi);border-color:var(--hi)}
.items input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.l1{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.l1 .nm{font-weight:600;overflow-wrap:anywhere}
.l1 .am{color:var(--hi);font-weight:700;font-variant-numeric:tabular-nums}
.l2{display:block;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.badge{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--hi-soft);color:var(--hi)}
.items li.done .nm,.items li.done .am{text-decoration:line-through;color:var(--muted)}
.prog{color:var(--muted);font-size:14px;margin:4px 0 8px}
.copybox{width:100%;min-height:150px;margin-top:12px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.copybox[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:100;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
</style>
</head>

<script>window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#7A1F1F;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px';d.textContent='Fehler: '+(e.message||'unbekannt')+' ('+(e.lineno||'?')+')';document.body.appendChild(d);});</script>


<div class="wrap">
  <header class="head">
    <div>
      <h1>Unsere Rezeptkarten</h1>
      <p>Jede Karte ergibt vier Portionen, also zweimal Essen für euch beide. Wählt Karten für die Woche aus, die Einkaufsliste entsteht von selbst.</p>
    </div>
    <div style="display:grid;gap:14px;justify-items:end">
      <button class="weekbtn" id="weekbtn" aria-haspopup="dialog">Woche <span class="n" id="weekn">0</span></button>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div class="search"><input id="q" type="search" placeholder="Rezept oder Zutat suchen" autocomplete="off" aria-label="Rezept oder Zutat suchen"></div>
  <div class="chips" id="cats" role="group" aria-label="Kategorie"></div>
  <div class="chips sub" id="flags" role="group" aria-label="Nur mit"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog class="sheet" id="dlg" aria-label="Rezept"></dialog>
<dialog class="drawer" id="drawer" aria-label="Woche"></dialog>
<div class="toast" id="toast" hidden role="status"></div>

r, Joghurt, Milch und Butter verrühren, kurz unter die Mehlmischung rühren. Der Teig soll nur gerade eben vermengt sein.","In die Form füllen, mit dem restlichen Käse bestreuen und etwa 45 Min. backen. Stäbchenprobe machen."],"tip":"Ohne Hefe und ohne Gehzeit. Passt zu Suppen und Salaten, mit Aufstrich oder Ei auch als Frühstück. Scheiben lassen sich einfrieren und im Toaster aufbacken.","variant":"","zut":[{"label":"","items":["350 g Dinkelmehl 550","1 Päckchen Backpulver","1 TL Salz","Pfeffer"]},{"label":"","items":["150 g geriebener Bergkäse oder Gouda","1 Bund Petersilie","1 Bund Schnittlauch"]},{"label":"","items":["2 Eier","150 g laktosefreier Joghurt","100 ml Milch","50 g Butter (geschmolzen und abgekühlt)"]}],"nut":{"per":"Portion","kcal":240,"p":10,"f":11,"c":26,"fib":2,"vit":[{"k":"K","name":"Vitamin K","pct":70}],"note":"","unit":"Scheibe","text":"Liefert viel Vitamin K, wichtig für Knochen und Blutgerinnung."}},{"id":58,"title":"Hähnchen-Lauch-Pie mit Quark-Butter-Teig","cat":"bak","aktiv":30,"passiv":"30 Min. Kühlen, 35 Min. Backen","portions":"4 Portionen","codes":["B","TM"],"tm":true,"buero":true,"frozen":true,"varoma":false,"veg":"nein","kind":"casserole","ing":["Teig: 250 g Dinkelmehl 550, 125 g kalte Butter, 125 g laktosefreier Magerquark, 1 TL Salz","Füllung: 400 g Hähnchenbrust, 2 Lauchstangen, 2 Karotten, 1 Zwiebel, 1 EL Butter","Soße: 1 EL Dinkelmehl 550, 250 ml Milch, 80 g geriebener Bergkäse, Muskat, Salz, Pfeffer","1 Ei (zum Bestreichen)"],"items":[{"c":"Dinkelmehl 550","a":"c","t":0,"q":"250","u":"g","n":""},{"c":"Butter","a":"k","t":0,"q":"125","u":"g","n":""},{"c":"Laktosefreier Magerquark","a":"k","t":0,"q":"125","u":"g","n":""},{"c":"Salz","a":"v","t":0,"q":"1","u":"TL","n":""},{"c":"Hähnchenbrust","a":"f","t":0,"q":"400","u":"g","n":""},{"c":"Lauch","a":"g","t":0,"q":"2","u":"","n":""},{"c":"Karotten","a":"g","t":0,"q":"2","u":"","n":""},{"c":"Zwiebeln","a":"g","t":0,"q":"1","u":"","n":""},{"c":"Butter","a":"k","t":0,"q":"1","u":"EL"," const inPlan=id=>Object.prototype.hasOwnProperty.call(S.plan,id);

function matches(r){
  if(F.cat!=='alle'&&r.cat!==F.cat) return false;
  if(F.buero&&!r.buero) return false;
  if(F.tm&&!r.tm) return false;
  if(F.varoma&&!r.varoma) return false;
  if(F.frozen&&!r.frozen) return false;
  if(F.hp&&!(r.nut&&r.nut.per==='Portion'&&(!r.nut.unit||r.nut.unit==='Glas')&&r.nut.p>=20)) return false;
  if(F.veg&&r.veg==='nein') return false;
  if(F.q){
    const hay=(r.title+' '+r.zut.map(z=>z.items.join(' ')).join(' ')).toLowerCase();
    if(!F.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function num(x){const w=Math.floor(x+1e-9),f=x-w,sym={0.25:'¼',0.5:'½',0.75:'¾'};for(const k in sym)if(Math.abs(f-k)<0.01)return(w>0?String(w):'')+sym[k];if(f<0.01)return String(w);return x.toFixed(1).replace('.',',');}
function parseQ(q){const one=p=>p.includes('/')?(+p.split('/')[0])/(+p.split('/')[1]):parseFloat(p);const a=q.split('–');return a.length>1?[one(a[0]),one(a[1])]:[one(a[0]),one(a[0])];}
function rng(lo,hi,u){const n=Math.abs(lo-hi)<1e-9?num(lo):num(lo)+'–'+num(hi);return n+(u?' '+(hi>1&&PLUR[u]?PLUR[u]:u):'');}

      let o=m.get(it.c);
      if(!o){o={c:it.c,a:it.a,t:it.t,units:new Map(),loose:false,notes:new Set(),rec:[]};m.set(it.c,o);}
      if(it.q){const [lo,hi]=parseQ(it.q);const cur=o.units.get(it.u)||{lo:0,hi:0};cur.lo+=lo;cur.hi+=hi;o.units.set(it.u,cur);} else o.loose=true;
      if(it.n&&it.n.length<48) o.notes.add(it.n);
      const sn=short(r.title); if(!o.rec.includes(sn)) o.rec.push(sn);
    }
  }
  return [...m.values()];
}
function amountOf(o){
  if(o.a==='v') return '';
  const p=[...o.units.entries()].map(([u,v])=>rng(v.lo,v.hi,u));
  return p.length?p.join(' + ')+(o.loose?' + etwas':''):'nach Bedarf';
}
function listText(){
  const agg=aggregate(),lines=['Einkaufsliste'];
  for(const a of ['g','k','f','t','c','b','v']){
    const g=agg.filter(o=>o.a===a&&!S.chk[o.c]).sort((x,y)=>x.c.localeCompare(y.c,'de'));
    if(!g.length) continue;
    lines.push('',AIS[a]+(a==='v'?' (zu Hause prüfen)':''));
    g.forEach(o=>{const am=amountOf(o);lines.push('- '+o.c+(am?': '+am:''));});
  }
  return lines.join('\n');
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200);}
function doCopy(){
  const txt=listText(),box=$('#copybox');
  const fb=()=>{box.value=txt;box.hidden=false;box.focus();box.select();toast('Zum Kopieren markieren');};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Liste kopiert'),fb);else fb();}catch(e){fb();}
}

/* drawer */
let tab='plan';
function pitem(id){
  const r=byId[id];
  return `<div class="pitem" style="--cc:var(--c-${r.cat})"><div class="pthumb">${ILLU(r.kind,r.id)}</div><div><div class="t">${esc(r.title)}</div>
   <div class="row"><select data-act="day" data-id="${id}" aria-label="Tag für ${esc(short(r.title))}"><option value="">ohne Tag</option>${DAYS.map(([k,l])=>`<option value="${k}"${S.plan[id]===k?' selected':''}>${l}</option>`).join('')}</select>
   <button class="link" data-act="toggle" data-id="${id}">entfernen</button></div></div></div>`;
}
function renderDrawer(){
  const ids=Object.keys(S.plan).map(Number),n=ids.length;
  let body='';
  if(tab==='plan'){
    body=`<div class="actions"><button class="btn hi small" data-act="suggest">Neue Woche vorschlagen</button><button class="btn ghost small" data-act="week1">Woche 1 laden</button><button class="btn ghost small" data-act="clear">Leeren</button></div>`;
    if(!n) body+=`<p class="hint" style="margin-top:16px">Noch nichts geplant. Tippe auf das Plus bei einem Rezept oder lass dir eine Woche vorschlagen.</p>`;
    for(const [k,l] of DAYS){const x=ids.filter(i=>S.plan[i]===k);if(x.length)body+=`<div class="dayh mono">${l}</div>`+x.map(pitem).join('');}
    const free=ids.filter(i=>!S.plan[i]);
    if(free.length)body+=`<div class="dayh mono">Noch ohne Tag</div>`+free.map(pitem).join('');
  } else {
    if(!n) body=`<p class="hint">Die Einkaufsliste ist leer. Plane zuerst ein paar Rezepte.</p>`;
    else{
      const agg=aggregate(),shop=agg.filter(o=>o.a!=='v'),done=shop.filter(o=>S.chk[o.c]).length;
      body=`<div class="actions"><button class="btn small" data-act="copy">Liste kopieren</button><button class="btn ghost small" data-act="uncheck">Häkchen löschen</button></div>
       <div class="prog">${done} von ${shop.length} Artikeln abgehakt</div><textarea class="copybox" id="copybox" readonly hidden aria-label="Einkaufsliste als Text"></textarea>`;
      for(const a of ['g','k','f','t','c','b','v']){
        const g=agg.filter(o=>o.a===a).sort((x,y)=>x.c.localeCompare(y.c,'de'));if(!g.length)continue;
        body+=`<section class="aisle"><h3 class="mono" style="color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between"><span>${esc(AIS[a])}</span><span>${g.length}</span></h3>${a==='v'?'<p class="hint">Gewürze und Basics. Haken setzen, wenn ihr es zu Hause habt.</p>':''}<ul class="items">`+g.map(o=>{
          const chk=!!S.chk[o.c],note=[...o.notes].join('; '),am=amountOf(o);
          return `<li class="${chk?'done':''}"><label><input type="checkbox" data-key="${esc(o.c)}" ${chk?'checked':''}><span><span class="l1"><span class="nm">${esc(o.c)}</span>${am?`<span class="am">${esc(am)}</span>`:''}${o.t===1?'<span class="badge">evtl. Edeka</span>':''}${o.t===2?'<span class="badge">Koro</span>':''}</span><span class="l2">${esc([note,a==='v'?'':'für '+o.rec.join(', ')].filter(Boolean).join(' · '))}</span></span></label></li>`;
        }).join('')+`</ul></section>`;
      }
      body+=`<p class="hint" style="margin-top:20px">Mengen sind Richtwerte aus den Rezepten für vier Portionen. Gleiche Einheiten werden addiert.</p>`;
    }
  }
  const d=$('#drawer');
  d.innerHTML=`<div class="dr-head"><h2>Woche</h2><button class="btn ghost small" data-act="closedrawer">Schließen</button></div>
   <div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-id="plan" aria-selected="${tab==='plan'}">Plan (${n})</button><button class="tab" role="tab" data-act="tab" data-id="einkauf" aria-selected="${tab==='einkauf'}">Einkauf</button></div>
   <div class="dr-body">${body}</div>`;
}
function openModal(d){try{if(typeof d.showModal==='function'){d.showModal();return;}}catch(e){}d.setAttribute('open','');d.style.position='fixed';d.style.inset='0';d.style.zIndex='50';}
function openDrawer(t){tab=t||tab;const d=$('#drawer');renderDrawer();if(!d.open)openModal(d);}

/* suggest a week */
function pick(pool,used){const p=pool.filter(r=>!used.has(r.id));return p[Math.floor(Math.random()*p.length)];}
function suggest(){
  for(let tries=0;tries<300;tries++){
    const used=new Set(),plan={};
    const add=(r,d)=>{if(!r)return false;used.add(r.id);plan[r.id]=d;return true;};
    const we=R.filter(r=>r.cat==='we'),wt=R.filter(r=>r.cat==='wt'),fs=R.filter(r=>r.cat==='fs'),vor=R.filter(r=>r.cat==='vor'&&r.id!==47);
    const ok=add(pick(we,used),'Sa')&&add(pick(we.filter(r=>r.buero),used),'So')&&add(pick(wt,used),'Mo')&&add(pick(wt.filter(r=>r.buero),used),'Di')&&add(pick(wt,used),'Mi')&&add(pick(wt.filter(r=>r.buero),used),'Do')&&add(pick(we.concat(wt),used),'Fr')&&add(pick(fs,used),'')&&add(pick(fs,used),'')&&add(pick(vor,used),'Sa');
    if(!ok) continue;
    const meat=Object.keys(plan).filter(i=>byId[i].veg==='nein').length;
    if(meat>2) continue;
    S.plan=plan;S.chk={};save();return;
  }
}

/* detail */
function nutOf(r){const n=r.nut;if(!n)return '';return `<div class="nut"><div class="nv"><span><b>ca. ${n.kcal} kcal</b></span><span><b>${n.p} g</b> Eiweiß</span><span><b>${n.f} g</b> Fett</span><span><b>${n.c} g</b> Kohlenhydrate</span><span><b>${n.fib} g</b> Ballaststoffe</span></div>${n.text?`<p>${esc(n.text)}</p>`:''}<small>Pro ${n.unit||(n.per==='Portion'?'Portion':'100 g')}, geschätzt aus den Zutatenmengen (Nährwerttabellen). ${esc(n.note||'')}</small></div>`}
function openDetail(id){
  const r=byId[id],d=$('#dlg'),on=inPlan(id);
  d.style.setProperty('--cc',`var(--c-${r.cat})`);
  const zut=r.zut.map(z=>(z.label?`<li class="lab">${esc(z.label)}</li>`:'')+z.items.map(i=>`<li>${esc(i)}</li>`).join('')).join('');
  d.innerHTML=`<div class="dhero">${ILLU(r.kind,r.id)}<button class="xbtn" data-act="close">Schließen</button></div>
   <div class="dscroll"><div class="dhead"><span class="mono" style="color:var(--hi)">${esc(catName[r.cat])}</span><h2>${esc(r.title)}</h2>
   <div class="dmeta"><span><b>${r.aktiv} Min</b> aktiv</span>${r.passiv?`<span><b>${esc(r.passiv.replace(/\./g,''))}</b></span>`:''}<span><b>${esc(r.portions.replace(/\s*\(.*\)/,''))}</b></span></div><div class="tags" style="margin-top:12px">${tagsOf(r)}</div>${nutOf(r)}</div>
   <div class="dbody"><div class="cols"><section><h3>Zutaten</h3><ul class="zl">${zut}</ul></section>
   <section><h3>Zubereitung</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section></div>
   ${r.variant?`<div class="note"><b>Variante</b>${esc(r.variant.replace(/^Variante[^:]*:\s*/,''))}</div>`:''}
   ${r.tip?`<div class="note"><b>Tipp</b>${esc(r.tip)}</div>`:''}</div></div>
   <div class="dfoot"><button class="btn ghost" data-act="close">Schließen</button><button class="btn ${on?'':'hi'}" data-act="toggle-dlg" data-id="${id}">${on?'In der Woche, entfernen':'Zur Woche hinzufügen'}</button></div>`;
  if(!d.open)openModal(d);
}

function toggle(id){if(inPlan(id))delete S.plan[id];else S.plan[id]='';save();refresh();}
function refresh(){
  renderChips();renderGrid();
  if($('#drawer').open)renderDrawer();
  const d=$('#dlg');if(d.open){const b=d.querySelector('[data-act="toggle-dlg"]');if(b){const id=+b.dataset.id,on=inPlan(id);b.className='btn '+(on?'':'hi');b.textContent=on?'In der Woche, entfernen':'Zur Woche hinzufügen';}}
}
document.addEventListener('click',e=>{
  if(e.target===$('#dlg')){$('#dlg').close();return;}
  if(e.target===$('#drawer')){$('#drawer').close();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='cat'){F.cat=id;refresh();}
  else if(a==='flag'){F[id]=!F[id];refresh();}
  else if(a==='toggle'||a==='toggle-dlg')toggle(+id);
  else if(a==='detail')openDetail(+id);
  else if(a==='close')$('#dlg').close();
  else if(a==='closedrawer')$('#drawer').close();
  else if(a==='tab'){tab=id;renderDrawer();}
  else if(a==='suggest'){suggest();refresh();}
  else if(a==='week1'){S.plan=Object.assign({},WEEK1);S.chk={};save();refresh();}
  else if(a==='clear'){S.plan={};S.chk={};save();refresh();}
  else if(a==='uncheck'){S.chk={};save();renderDrawer();}
  else if(a==='copy')doCopy();
});
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-act="day"]');
  if(s){S.plan[s.dataset.id]=s.value;save();renderDrawer();return;}
  const c=e.target.closest('input[data-key]');if(!c)return;
  if(c.checked)S.chk[c.dataset.key]=1;else delete S.chk[c.dataset.key];
  save();
  const li=c.closest('li');if(li)li.classList.toggle('done',c.checked);
  const shop=aggregate().filter(o=>o.a!=='v'),done=shop.filter(o=>S.chk[o.c]).length;
  const p=document.querySelector('.prog');if(p)p.textContent=`${done} von ${shop.length} Artikeln abgehakt`;
});
$('#q').addEventListener('input',e=>{F.q=e.target.value.trim();renderChips();renderGrid();});
$('#weekbtn').addEventListener('click',()=>openDrawer('plan'));
$('#drawer').addEventListener('close',renderGrid);
refresh();
})();
</script>

</body>
</html>
